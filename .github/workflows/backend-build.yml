name: Backend - Build, Lint and Test

on:
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
  push:
    branches:
      - master
    paths:
      - 'backend/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Run linter
        run: npm run lint
