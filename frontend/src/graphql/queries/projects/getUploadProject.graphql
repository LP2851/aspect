query GetUploadProject($where: UploadProjectWhereUniqueInput!) {
  uploadProject(where: $where) {
    id
    projectName
    description
    user {
      name
    }
    status
    uploadLocation {
      id
      type
    }
    uploadsTo {
      id
      uploadStatus
      uploadTo
    }
    uploadsToCount
    createdAt
    updatedAt
    deletedAt
  }
}
